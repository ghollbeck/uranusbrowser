<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uranus Browser launch videos</title>
  <meta name="description" content="Watch the Uranus Browser desktop demo and iPhone tour.">
  <style>
    :root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 1.25rem; }
    main { max-width: 54rem; margin: 0 auto; padding: clamp(0rem, 4vw, 2rem); }
    section { margin-block: 2rem; scroll-margin: 1rem; }
    video { display: block; width: 100%; max-height: 80vh; background: #111; border-radius: .7rem; }
    #iphone video { max-width: 38rem; }
    a { color: LinkText; }
  </style>
</head>
<body>
<main>
  <a href="/">← Uranus Browser</a>
  <h1>Launch videos</h1>
  <p>Videos autoplay muted where supported. Use the player controls to turn on the narration.</p>

  <section id="desktop" aria-labelledby="desktop-title">
    <h2 id="desktop-title">Uranus Browser for Mac</h2>
    <video aria-labelledby="desktop-title" autoplay muted playsinline loop controls preload="metadata"
           src="/assets/uranus-browser-desktop.mp4" poster="/assets/uranus-browser-desktop-thumbnail.png">
      <a href="/assets/uranus-browser-desktop.mp4">Watch the Mac demo</a>
    </video>
  </section>

  <section id="iphone" aria-labelledby="iphone-title">
    <h2 id="iphone-title">Uranus Browser for iPhone</h2>
    <video aria-labelledby="iphone-title" autoplay muted playsinline loop controls preload="metadata"
           src="/assets/uranus-browser-iphone.mp4" poster="/assets/uranus-browser-iphone-thumbnail.png">
      <a href="/assets/uranus-browser-iphone.mp4">Watch the iPhone tour</a>
    </video>
  </section>
</main>
</body>
</html>
