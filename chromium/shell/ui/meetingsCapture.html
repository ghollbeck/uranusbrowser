<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'"
    />
    <title>Uranus Browser meeting recorder</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="meetings.css" />
  </head>
  <body class="capture-page">
    <!-- As an offscreen document this page has no UI. Opened in a tab (?permission=1) it asks for the
         microphone once, because an offscreen document can't show Chromium's permission prompt. -->
    <main id="permission" class="permission" hidden>
      <h1>Allow Uranus Browser to use your microphone</h1>
      <p>Meeting notes record your microphone ("Me") while you are in a meeting, only after you press Start in the Agent panel. Audio is turned into text in chunks and is never saved.</p>
      <button id="allow" type="button" class="primary-button">Allow microphone</button>
      <p id="permission-result" role="status"></p>
    </main>
    <script type="module" src="meetingsCapture.js"></script>
  </body>
</html>
