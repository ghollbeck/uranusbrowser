<!doctype html>
<!-- The browser agent's harmless test page, served from this Mac at /__anus_agent_fixture__/
     (fixture-server.mjs). Plain clicks here run without an approval card; the feedback form's
     submit still asks first. Nothing on it leaves 127.0.0.1. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Uranus Browser agent test page</title>
    <style>
      body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; color: #16243a; background: #f6f8fb; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }
      section { background: #fff; border-radius: 12px; padding: 16px 20px; margin: 16px 0; box-shadow: 0 1px 2px rgba(11,37,69,.08); }
      label { display: block; margin: 8px 0 4px; font-weight: 500; }
      input, textarea { font: inherit; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c9d3e0; border-radius: 6px; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #0b2545; background: #0b2545; color: #fff; }
      #counter { font-weight: 700; }
      .long p { height: 120px; margin: 0; border-bottom: 1px dashed #dde3ea; }
      #status { color: #1f9d5b; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent test page</h1>
      <p>This page is for testing Uranus Browser's Agent panel. The counter is at <span id="counter">0</span>.</p>

      <section aria-labelledby="buttons">
        <h2 id="buttons">Buttons</h2>
        <button id="add" type="button">Add one</button>
        <button id="reset" type="button">Reset counter</button>
        <details><summary>More about this page</summary><p>Everything here stays on this computer.</p></details>
      </section>

      <section aria-labelledby="fields">
        <h2 id="fields">Fields</h2>
        <label for="name">Your name</label>
        <input id="name" name="display-name" type="text" placeholder="Ada Lovelace" />
        <label for="notes">Notes</label>
        <textarea id="notes" rows="3"></textarea>
        <p>Name preview: <span id="preview"></span></p>
      </section>

      <section aria-labelledby="feedback">
        <h2 id="feedback">Feedback</h2>
        <form id="feedback-form" method="post" action="/__anus_agent_fixture__/submit">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="3"></textarea>
          <p><button id="send" type="submit">Send feedback</button></p>
        </form>
        <p id="status"></p>
      </section>

      <section class="long" aria-labelledby="long">
        <h2 id="long">A long section</h2>
        <script>
          for (let i = 1; i <= 40; i++) document.write(`<p>Line ${i} of the long section.</p>`);
        </script>
        <h2 id="bottom">The bottom of the page</h2>
        <p>You scrolled all the way down. The secret word is <strong>papaya</strong>.</p>
      </section>
    </main>
    <script>
      const counter = document.getElementById('counter');
      document.getElementById('add').onclick = () => (counter.textContent = String(Number(counter.textContent) + 1));
      document.getElementById('reset').onclick = () => (counter.textContent = '0');
      const name = document.getElementById('name');
      name.addEventListener('input', () => (document.getElementById('preview').textContent = name.value));
      if (new URLSearchParams(location.search).has('sent')) document.getElementById('status').textContent = 'Feedback sent.';
    </script>
  </body>
</html>
