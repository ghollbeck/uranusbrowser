<!doctype html>
<meta charset="utf-8"><title>Meet mock</title>
<style>
  body { font: 14px sans-serif; display: grid; grid-template-columns: repeat(3, 160px); gap: 8px; padding: 12px; }
  [data-participant-id] { position: relative; height: 90px; background: #223; color: #fff; border-radius: 8px; }
  .ring { border-top: 6px solid #4af; width: 100%; }
  .name { position: absolute; bottom: 6px; left: 8px; }
</style>
<div data-participant-id="p1"><div><div class="ring"></div></div><span class="name notranslate">Alice Example</span></div>
<div data-participant-id="p2"><div><div class="ring"></div></div><span class="name notranslate">Bob Example</span></div>
<div data-participant-id="p3"><div><div class="ring"></div></div><span class="name notranslate">You</span></div>
<script>
  // A silent tile has a hidden leaf element with a thick border (the speaking ring), like Meet's.
  const tiles = [...document.querySelectorAll('[data-participant-id]')];
  window.__speak = (name) => {
    for (const tile of tiles) {
      const ring = tile.querySelector('.ring');
      const speaking = name && tile.querySelector('.name').textContent === name;
      ring.style.display = speaking ? 'block' : 'none';
    }
  };
  window.__speak(null);
</script>
