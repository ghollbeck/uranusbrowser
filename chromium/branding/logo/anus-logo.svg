<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Uranus Browser</title>
  <!-- Master of the Uranus Browser logo, the "Arrow" in the ScienceOS desktop icon's style: a flat
       white tile (ScienceOS's own geometry, 46..978 x 50..974, rx 185: nearly full bleed, so it
       sits the same size as ScienceOS in the Dock), a bold pure-black arrow whose tail runs off
       the tile's bottom edge. No gradient, no shadow. 1024 grid; everything else in
       chromium/branding is rendered from this by build-logo.sh. -->
  <defs>
    <clipPath id="anus-logo-tile"><rect x="46" y="50" width="932" height="924" rx="185"/></clipPath>
  </defs>
  <rect x="46" y="50" width="932" height="924" rx="185" fill="#ffffff"/>
  <g clip-path="url(#anus-logo-tile)" fill="none" stroke="#000000" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M300 1120C300 760 360 620 660 360" stroke-width="212"/>
    <path d="M884 140L470 236L790 552Z" fill="#000000" stroke-width="40"/>
  </g>
</svg>
